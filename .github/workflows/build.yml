# f69 — CI / release pipeline.
#
# Triggers:
#   - push to main:    run tests only (no artifacts — keeps main pushes cheap)
#   - tag v*:          run tests + build all artifacts + publish a GitHub Release
#   - PR:              run tests only
#   - manual dispatch: run tests + build all artifacts (no release attached)
#
# The deb / rpm jobs run in their target distro's container so the
# native packaging tools (dpkg-buildpackage, rpmbuild) work without
# nested docker. Kept on continue-on-error while the native packaging
# tooling (dpkg-buildpackage, rpmbuild) settles — link deps now match
# Debian/Fedora's full-featured libarchive so the build itself works.

name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: 0.16.0

# Permissions for the release job. Other jobs default to read-only.
permissions:
  contents: read

jobs:
  # ----- Fast feedback: tests + a sanity build on every push/PR -----
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # setup-zig has no Node 24 release yet (latest v2.2.1 is still node20),
      # so it emits the Node-20 deprecation warning — non-fatal, it runs on the
      # node24 runtime. Kept for its zig-package cache (big build speedup);
      # bump when upstream ships node24. All other actions are node24.
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libavif-dev libdav1d-dev libsqlite3-dev libssl-dev \
            libarchive-dev libdbus-1-dev liblzma-dev libbz2-dev \
            zlib1g-dev libxml2-dev libzstd-dev liblz4-dev nettle-dev libacl1-dev
      - name: Tests
        run: zig build test
      - name: Headless integration tests (dvui testing backend)
        run: zig build test-integration

  # ----- Portable bundle (full): binary + bundled libs + run.sh -----
  portable:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config patchelf \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libavif-dev libdav1d-dev libsqlite3-dev libssl-dev \
            libarchive-dev libdbus-1-dev liblzma-dev libbz2-dev \
            zlib1g-dev libxml2-dev libzstd-dev liblz4-dev nettle-dev libacl1-dev
      - name: Build portable bundle
        run: zig build portable
      - name: Package as tarball
        run: |
          VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
          mkdir -p artifacts
          tar --exclude=data -C zig-out -czf "artifacts/f69-${VER}-linux-portable-x86_64.tar.gz" bin
      - uses: actions/upload-artifact@v6
        with:
          name: f69-portable
          path: artifacts/

  # ----- Slim bundle: binary + run.sh + DEPS.md (no libs) -----
  portable-slim:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: System deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libavif-dev libdav1d-dev libsqlite3-dev libssl-dev \
            libarchive-dev libdbus-1-dev liblzma-dev libbz2-dev \
            zlib1g-dev libxml2-dev libzstd-dev liblz4-dev nettle-dev libacl1-dev
      - name: Build slim bundle
        run: zig build portable-slim
      - name: Package as tarball
        run: |
          VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
          mkdir -p artifacts
          tar -C zig-out -czf "artifacts/f69-${VER}-linux-slim-x86_64.tar.gz" portable-slim
      # Smoke the slim bundle HERE, on the same runner that built it — the
      # slim bundle uses the SYSTEM glibc, so its floor is this host's glibc
      # and it can't be tested on an older base like the other formats. The
      # runner has no GPU, so the launch check reaches the clean GPU-abort.
      - name: Smoke-test slim bundle (host glibc)
        continue-on-error: true
        run: bash scripts/smoke-package.sh artifacts/f69-*-linux-slim-x86_64.tar.gz
      - uses: actions/upload-artifact@v6
        with:
          name: f69-slim
          path: artifacts/

  # ----- Arch: native makepkg inside archlinux:latest -----
  arch:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container:
      image: archlinux:latest
    steps:
      - name: Container deps
        run: |
          pacman -Sy --noconfirm --needed \
            base-devel sudo git zig pkg-config wayland-protocols \
            sqlite openssl dav1d libavif libarchive dbus \
            vulkan-icd-loader wayland libxkbcommon libdecor libx11 \
            libxext libxcursor libxi libxrandr
      - uses: actions/checkout@v5
      - name: Generate PKGBUILD
        run: zig build aur
      - name: Build .pkg.tar.zst
        run: |
          # makepkg refuses root, so do it as a build user.
          useradd -m -s /bin/bash builder
          chown -R builder:builder .
          sudo -u builder bash -c '
            set -euxo pipefail
            cp zig-out/aur/PKGBUILD ./
            # Patch source= to use the working-tree tarball.
            VER=$(awk -F= "/^pkgver=/ { print \$2 }" PKGBUILD)
            # Write the tarball outside cwd, then move it back. Writing
            # it in-place makes tar walk a dir whose contents change as
            # the .tar.gz grows, triggering "file changed as we read it"
            # and exit 1.
            tar --exclude=./.git --exclude=./.zig-cache --exclude=./zig-out \
                --exclude=./dist --exclude=./.direnv \
                --transform "s,^\\./,f69-${VER}/," \
                -czf "/tmp/f69-${VER}.tar.gz" .
            mv "/tmp/f69-${VER}.tar.gz" "f69-${VER}.tar.gz"
            sed -i "s|^source=.*|source=(\"f69-${VER}.tar.gz\")|" PKGBUILD
            sed -i "s|^sha256sums=.*|sha256sums=(\"SKIP\")|" PKGBUILD
            makepkg --noconfirm -f --skipchecksums
          '
          VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
          mkdir -p artifacts
          # main package only — skip the auto-generated -debug split package.
          for f in *.pkg.tar.zst; do case "$f" in *-debug-*) ;; *) mv "$f" "artifacts/f69-${VER}-arch-x86_64.pkg.tar.zst";; esac; done
      - uses: actions/upload-artifact@v6
        with:
          name: f69-arch
          path: artifacts/

  # ----- Debian: native dpkg-buildpackage inside debian:bookworm-slim -----
  # Targets Debian stable (bookworm). Native packages dynamically link
  # system libs, so this .deb is correct for bookworm-based systems; users
  # on newer/rolling derivatives (e.g. Debian sid) should use the portable
  # bundle or rebuild on a matching base (F69_DEB_BASE / the deb container).
  debian:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container:
      image: debian:bookworm-slim
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Container deps
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            build-essential debhelper devscripts \
            pkg-config curl ca-certificates xz-utils git \
            libwayland-dev libxkbcommon-dev libdecor-0-dev \
            libavif-dev libdav1d-dev libsqlite3-dev libssl-dev \
            libarchive-dev libdbus-1-dev liblzma-dev libbz2-dev \
            zlib1g-dev libxml2-dev libzstd-dev liblz4-dev nettle-dev libacl1-dev
      - name: Install Zig from upstream
        run: |
          curl -fsSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" \
            | tar -xJf - -C /usr/local
          ln -sf "/usr/local/zig-x86_64-linux-${ZIG_VERSION}/zig" /usr/local/bin/zig
          zig version
      - uses: actions/checkout@v5
      - name: Generate debian/
        run: zig build deb
      - name: Build .deb
        run: |
          cp -r zig-out/debian ./debian
          dpkg-buildpackage -us -uc -b -d
          VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
          mkdir -p artifacts
          # main package only — skip the auto-generated -dbgsym debug package.
          for f in ../*.deb; do case "$f" in *dbgsym*) ;; *) mv "$f" "artifacts/f69-${VER}-debian-x86_64.deb";; esac; done
      - uses: actions/upload-artifact@v6
        with:
          name: f69-debian
          path: artifacts/

  # ----- Fedora: native rpmbuild inside fedora:latest -----
  # Targets current Fedora. The .rpm requires the build base's glibc, so it
  # installs on Fedora >= the runner's version; older Fedora / atomic users
  # should use the portable bundle or rebuild on a matching base
  # (F69_RPM_BASE=fedora:<N>).
  fedora:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    container:
      image: fedora:latest
    steps:
      - name: Container deps
        run: |
          dnf install -y --skip-unavailable rpm-build rpmdevtools patchelf zig pkgconfig git tar \
            wayland-devel libxkbcommon-devel libdecor-devel \
            libavif-devel libdav1d-devel sqlite-devel openssl-devel \
            libarchive-devel dbus-devel \
            bzip2-devel zlib-devel xz-devel \
            libzstd-devel lz4-devel nettle-devel libxml2-devel libacl-devel
      - uses: actions/checkout@v5
      - name: Generate .spec
        run: zig build rpm
      - name: Build .rpm
        run: |
          rpmdev-setuptree
          VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
          tar --exclude=./.git --exclude=./.zig-cache --exclude=./zig-out \
              --exclude=./dist --exclude=./.direnv \
              --transform "s,^\./,f69-${VER}/," \
              -czf "$HOME/rpmbuild/SOURCES/f69-${VER}.tar.gz" .
          cp zig-out/rpm/f69.spec "$HOME/rpmbuild/SPECS/"
          rpmbuild -bb "$HOME/rpmbuild/SPECS/f69.spec"
          mkdir -p artifacts
          # main package only — skip the -debuginfo / -debugsource RPMs.
          for f in "$HOME"/rpmbuild/RPMS/x86_64/*.rpm; do case "$f" in *debuginfo*|*debugsource*) ;; *) mv "$f" "artifacts/f69-${VER}-fedora-x86_64.rpm";; esac; done
      - uses: actions/upload-artifact@v6
        with:
          name: f69-fedora
          path: artifacts/

  # ----- Windows: cross-compile f69.exe + DLL bundle (mingw via nix) -----
  # scripts/build-windows.sh builds the mingw C-lib prefix from
  # nix/windows-deps.nix, then `zig build -Dtarget=x86_64-windows-gnu`.
  # package-windows.sh resolves the exact DLL closure (objdump BFS).
  windows:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - uses: mlugg/setup-zig@v2
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pkg-config binutils
      - name: Cross-compile f69.exe (x86_64-windows-gnu)
        run: bash scripts/build-windows.sh
      - name: Package Windows zip (exe + DLL closure)
        run: |
          bash scripts/package-windows.sh
          VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
          mv zig-out/f69-windows.zip "zig-out/f69-${VER}-windows-x86_64.zip"
      - uses: actions/upload-artifact@v6
        with:
          name: f69-windows
          path: zig-out/f69-*-windows-x86_64.zip

  # ----- Nix flake build -----
  nix:
    runs-on: ubuntu-latest
    needs: test
    # Artifacts build only on a tag (release) or a manual run — never on a
    # plain push to main.
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    continue-on-error: true   # impure-zig-fetch problem documented in flake.nix
    steps:
      - uses: actions/checkout@v5
      - uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes
      - name: nix flake check
        run: nix flake check --no-build
      - name: nix build .#f69
        # The flake's packages.f69 derivation needs network access for
        # Zig's fetch — Nix sandbox blocks that by default. --impure
        # tolerates the network call but is non-hermetic; a downstream
        # packager would replace this with a vendored fetchZigDeps.
        run: nix build .#f69 --impure || echo "nix build failed (impure fetch story TBD)"
      - name: Smoke-test nix result
        # Same headless battery as the other packages, run against the built
        # store prefix (./result → bin/f69, a wrapProgram wrapper over the
        # real ELF). Skips cleanly if the (best-effort) build above produced
        # no result.
        run: |
          if [ -e result/bin/f69 ]; then
            VER=$(awk -F'"' '/\.version = / { print $2; exit }' build.zig.zon)
            F69_EXPECT_VERSION="$VER" bash scripts/smoke-package.sh "$(readlink -f result)"
          else
            echo "no result/ — skipping nix smoke (build did not produce a package)"
          fi

  # ----- Smoke: install each built package in its target distro + run it -----
  # Headless per-package acceptance test (scripts/smoke-package.sh): install
  # the artifact, assert `--version`, `ldd` (no missing libs), a launch that
  # reaches the clean GPU-abort after a full non-GUI startup (DB open +
  # migrate + backup), and the expected shipped files. No GPU needed — the
  # container has no Vulkan device, which is exactly the path we assert.
  #
  # Each format is tested where its glibc floor is satisfied:
  #   - deb/rpm/arch: in their own build container (exact glibc match).
  #   - portable-full: in OLD-glibc debian:bookworm — it bundles its own
  #     glibc loader, so it MUST run there. (If the CI lib-harvest ships a
  #     hollow bundle — the known empty-$LD_LIBRARY_PATH issue — this is what
  #     catches it.)
  # The slim bundle's glibc floor is the build host itself, so it can't run on
  # an older base; it's smoked on the runner inside the portable-slim job.
  #
  # continue-on-error while packaging settles (hollow-bundle + native-tool
  # issues are still open): the job SURFACES package breakage without blocking
  # a release. Once the package builds are reliably green, drop
  # continue-on-error and add `smoke` to the release job's `needs` to make it
  # a hard gate.
  smoke:
    needs: [portable, arch, debian, fedora, windows]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - artifact: f69-debian
            image: debian:bookworm-slim
            prep: apt-get update -qq && apt-get install -y -qq --no-install-recommends ca-certificates
          - artifact: f69-fedora
            image: fedora:latest
            prep: dnf install -y -q findutils >/dev/null
          - artifact: f69-arch
            image: archlinux:latest
            prep: pacman -Sy --noconfirm --needed >/dev/null
          - artifact: f69-portable
            image: debian:bookworm-slim
            prep: apt-get update -qq && apt-get install -y -qq --no-install-recommends libvulkan1
          # Windows: PE DLL-closure completeness via objdump (binutils reads
          # PE import tables) + unzip — no Wine, so no GPU/display needed.
          - artifact: f69-windows
            image: debian:bookworm-slim
            prep: apt-get update -qq && apt-get install -y -qq --no-install-recommends binutils unzip
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: artifacts
      - name: Prep container + smoke-test artifact(s)
        run: |
          ${{ matrix.prep }}
          fail=0
          for f in artifacts/*.deb artifacts/*.rpm artifacts/*.pkg.tar.zst artifacts/*.tar.gz artifacts/*.zip; do
            [ -e "$f" ] || continue
            bash scripts/smoke-package.sh "$f" || fail=1
          done
          exit $fail

  # ----- Release: aggregate artifacts on tag push -----
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, portable, portable-slim, arch, debian, fedora, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v7
        with:
          path: artifacts/
      - name: Flatten artifact dirs
        run: |
          mkdir -p release/
          find artifacts/ -type f -exec cp {} release/ \;
          ls -la release/
      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: release/*
          generate_release_notes: true
          fail_on_unmatched_files: false
